name: nightly
on:
  schedule: [{cron: "0 11 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt}
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v4
        with: {path: data/raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-"}
      - run: python pipeline/fetch.py
        env: {FINMIND_TOKEN: "${{ secrets.FINMIND_TOKEN }}"}
      - run: python pipeline/build.py
      - name: commit data
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add web/public/data/latest.json && git commit -m "data $(date -u +%F)" || exit 0
          git push
